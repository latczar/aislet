plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.untethered'
version = '1.0.0'

android {
  namespace "app.untethered.library"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Kiwix's reader for .zim files, with its full-text search (GPL-3.0).
  implementation 'org.kiwix:libkiwix:2.2.4'
}
