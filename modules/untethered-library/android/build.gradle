plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.untethered'
version = '1.0.0'

android {
  namespace "app.untethered.library"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Kiwix's reader for .zim files, with its full-text search (GPL-3.0).
  implementation 'org.kiwix:libkiwix:2.2.4'
  // Reads the text of your own PDFs, in Java (no native code) (Apache 2.0).
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
  // LinkCryptoTest: the private link's native code against the shared vectors (pc/tests/link_vectors.json).
  testImplementation 'junit:junit:4.13.2'
}
